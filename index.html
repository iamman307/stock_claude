<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16344f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="投資總帳">
  <title>Stock Claude 投資總帳</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/app.css?v=1.1.0">
</head>
<body>
  <header class="topbar">
    <h1 id="viewTitle">總覽</h1>
    <button class="icon-btn" id="refreshButton" type="button" aria-label="更新匯率與報價" title="更新匯率與報價"></button>
    <button class="icon-btn" id="addButton" type="button" aria-label="記一筆交易" title="記一筆交易"></button>
    <button class="icon-btn" id="settingsButton" type="button" aria-label="設定與備份" title="設定與備份"></button>
  </header>

  <main>
    <section class="view active" id="view-overview" aria-label="總覽"></section>
    <section class="view" id="view-holdings" aria-label="持倉"></section>
    <section class="view" id="view-trades" aria-label="交易"></section>
    <section class="view" id="view-performance" aria-label="績效"></section>
    <section class="view" id="view-funds" aria-label="資金"></section>
    <section class="view" id="view-settings" aria-label="設定"></section>
  </main>

  <nav class="tabbar" aria-label="主要頁面">
    <div class="tabbar-inner" id="tabbar"></div>
  </nav>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fileInput" accept="application/json,.json" hidden>

  <script src="js/core.js?v=1.1.0"></script>
  <script src="js/migrate.js?v=1.1.0"></script>
  <script src="js/storage.js?v=1.1.0"></script>
  <script src="js/market.js?v=1.1.0"></script>
  <script src="js/charts.js?v=1.1.0"></script>
  <script src="js/app.js?v=1.1.0"></script>
</body>
</html>
